# Spring application name
spring.application.name=ElevatorBackend

# In-memory H2 database configuration (non-persistent)
spring.datasource.url=jdbc:h2:mem:smartelevator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Flyway configuration for database migrations
spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:mem:smartelevator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.flyway.user=sa
spring.flyway.password=password
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console enabled for local testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging configuration
logging.level.root=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

logging.level.com.smartelevator.backend.service.ElevatorTripService=DEBUG

spring.web.resources.static-locations=classpath:/static/

# No static cache
spring.web.resources.cache.cachecontrol.no-store=true
